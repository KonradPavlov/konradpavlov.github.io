[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PavStat"
version = "0.3.0"
description = "Publication-ready biostatistical & epidemiological summary tables in Python (alternative to R compareGroups, gtsummary, and epitools)."
readme = "README.md"
authors = [
    { name = "SALLAN Konrad Pavlov" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "biostatistics", "epidemiology", "medical-research", "clinical-trials",
    "table1", "gtsummary", "compareGroups", "epitools", "odds-ratio", "risk-ratio"
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.20.0",
    "scipy>=1.9.0",
    "statsmodels>=0.13.0",
    "python-docx>=0.8.11",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "openpyxl>=3.0.0",
]
